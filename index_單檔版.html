<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>要不要出門吃飯？</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#fff8f5;
  color:#4a2d29;
}
.wrap{
  width:min(720px,calc(100% - 28px));
  margin:30px auto;
}
.card{
  background:white;
  border:2px solid #f2d9d3;
  border-radius:28px;
  padding:28px 20px 32px;
  text-align:center;
  box-shadow:0 10px 30px rgba(90,55,45,.08);
  overflow:hidden;
}
.mascot{
  display:block;
  width:min(230px,65vw);
  height:230px;
  object-fit:contain;
  margin:0 auto 8px;
}
h1{
  font-size:clamp(24px,5vw,34px);
  margin:8px 0 28px;
}
.buttons{
  min-height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
}
button{font:inherit;cursor:pointer}
#yesBtn,#noBtn{
  border:0;
  border-radius:18px;
  padding:14px 28px;
  font-size:18px;
  font-weight:700;
  transition:transform .2s ease,padding .2s ease,font-size .2s ease;
}
#yesBtn{
  background:#ff8f9d;
  color:white;
}
#noBtn{
  background:#f7efed;
  color:#5b3a35;
  border:1px solid #ead5cf;
}
.success{
  display:none;
  padding:10px 0 20px;
}
.success h2{
  font-size:30px;
  margin:8px 0 10px;
}
.again{
  margin-top:18px;
  border:1px solid #ead5cf;
  border-radius:14px;
  padding:10px 18px;
  background:white;
  color:#5b3a35;
}
details{
  margin-top:22px;
  background:white;
  border:1px solid #efdcd7;
  border-radius:20px;
  padding:16px;
}
summary{cursor:pointer;font-weight:700}
.settings{text-align:left;margin-top:16px}
label{
  display:block;
  font-size:14px;
  font-weight:600;
  margin:13px 0 6px;
}
input,textarea{
  width:100%;
  border:1px solid #e9d5cf;
  border-radius:12px;
  padding:11px 12px;
  font:inherit;
  background:#fffdfc;
}
textarea{min-height:120px;resize:vertical}
.hint{font-size:13px;color:#8c716b;margin-top:7px}
.actions{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
.actions button{
  border:1px solid #ead5cf;
  border-radius:12px;
  padding:10px 14px;
  background:white;
  color:#5b3a35;
}
.actions .primary{
  background:#ff8f9d;
  color:white;
  border-color:#ff8f9d;
}
</style>
</head>

let noCount = 0;

const question = document.getElementById("question");
const mascot = document.getElementById("mascot");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const gameView = document.getElementById("gameView");
const successView = document.getElementById("successView");
const successText = document.getElementById("successText");

const firstQuestion = document.getElementById("firstQuestion");
const followQuestions = document.getElementById("followQuestions");
const yesText = document.getElementById("yesText");
const noText = document.getElementById("noText");
const successInput = document.getElementById("successInput");

function getQuestions(){
  return followQuestions.value.split("\n").map(s=>s.trim()).filter(Boolean);
}

function resetGame(){
  noCount = 0;
  question.textContent = firstQuestion.value || "今天要不要一起出門吃飯？";
  mascot.src = images[0];
  yesBtn.textContent = yesText.value || "好";
  noBtn.textContent = noText.value || "不要";
  yesBtn.style.transform = "scale(1)";
  yesBtn.style.padding = "14px 28px";
  yesBtn.style.fontSize = "18px";
  gameView.style.display = "";
  successView.style.display = "none";
}

noBtn.addEventListener("click", function(){
  noCount += 1;

  const qs = getQuestions();
  if (qs.length) {
    question.textContent = qs[Math.min(noCount - 1, qs.length - 1)];
  }

  mascot.src = images[Math.min(noCount, images.length - 1)];

  const scale = Math.min(1 + noCount * 0.28, 3.3);
  yesBtn.style.transform = `scale(${scale})`;
  yesBtn.style.padding = `${14 + Math.min(noCount*3,25)}px ${28 + Math.min(noCount*7,58)}px`;
  yesBtn.style.fontSize = `${18 + Math.min(noCount*2,12)}px`;
});

yesBtn.addEventListener("click", function(){
  successText.textContent = successInput.value || "那我們出門吃飯吧！";
  gameView.style.display = "none";
  successView.style.display = "block";
});

document.getElementById("againBtn").addEventListener("click", resetGame);
document.getElementById("applyBtn").addEventListener("click", resetGame);
document.getElementById("resetBtn").addEventListener("click", resetGame);

resetGame();
</script>
